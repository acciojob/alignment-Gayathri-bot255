<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HTML Assignment #3</title>
<style>
    body {
        font-family: "Times New Roman", Times, serif;
        border: 2px solid black;
        padding: 10px;
        margin: 20px;
    }
    h1 {
        text-align: center;
        font-size: 16px;
        margin-top: 0;
    }
    table {
        border-collapse: collapse;
        width: 100%;
        margin-bottom: 40px;
    }
    td {
        border: 1px solid black;
        padding: 2px 6px;
        height: 25px;
    }
    .left {
        text-align: left;
    }
    .center {
        text-align: center;
    }
    .right {
        text-align: right;
    }
    .green-row td {
        background-color: green;
    }
    .blue-row td {
        background-color: blue;
    }
    .img-cell {
        text-align: center;
        vertical-align: middle;
    }
    .img-cell img {
        max-width: 250px;
        display: block;
        margin: 0 auto;
    }
</style>
</head>
<body>

<h1>HTML Assignment #3</h1>

<!-- Table 1: simple left / center / right aligned rows -->
<table>
    <tr>
        <td class="left">left</td>
        <td class="center">center</td>
        <td class="right">right</td>
    </tr>
    <tr>
        <td class="left">left</td>
        <td class="center">center</td>
        <td class="right">right</td>
    </tr>
    <tr>
        <td class="left">left</td>
        <td class="center">center</td>
        <td class="right">right</td>
    </tr>
</table>

<!-- Table 2: complex merged-cell layout -->
<table>
    <tr>
        <td colspan="5">&nbsp;</td>
    </tr>
    <tr>
        <td rowspan="4">&nbsp;</td>
        <td>&nbsp;</td>
        <td>&nbsp;</td>
        <td>&nbsp;</td>
        <td>&nbsp;</td>
    </tr>
    <tr>
        <td colspan="3">&nbsp;</td>
        <td>&nbsp;</td>
    </tr>
    <tr>
        <td colspan="3">&nbsp;</td>
        <td>&nbsp;</td>
    </tr>
    <tr>
        <td>&nbsp;</td>
        <td>&nbsp;</td>
        <td>&nbsp;</td>
        <td>&nbsp;</td>
    </tr>
    <tr>
        <td colspan="5">&nbsp;</td>
    </tr>
</table>

<!-- Table 3: colored header/footer rows with an image in the middle cell -->
<table>
    <tr class="green-row">
        <td colspan="3">&nbsp;</td>
    </tr>
    <tr>
        <td>&nbsp;</td>
        <td class="img-cell">
            <img src="dunk.jpg" alt="Basketball player dunking">
        </td>
        <td>&nbsp;</td>
    </tr>
    <tr class="blue-row">
        <td colspan="3">&nbsp;</td>
    </tr>
</table>

</body>
</html>
