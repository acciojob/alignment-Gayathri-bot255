<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HTML Assignment #3</title>
<style>
  body { font-family: "Times New Roman", Times, serif; }
  table { border-collapse: collapse; width: 900px; margin-bottom: 30px; }
  td, th { border: 1px solid black; padding: 4px 6px; }
  h3 { text-align: center; }
  .green-bar { background-color: green; height: 20px; }
  .blue-bar { background-color: blue; height: 20px; }
  .center-img { text-align: center; }
  img { max-width: 260px; display: block; margin: 0 auto; }
</style>
</head>
<body>

<h3>HTML Assignment #3</h3>

<!-- Table 1: left / center / right alignment -->
<table>
  <tr>
    <td align="left">left</td>
    <td align="center">center</td>
    <td align="right">right</td>
  </tr>
  <tr>
    <td align="left">left</td>
    <td align="center">center</td>
    <td align="right">right</td>
  </tr>
  <tr>
    <td align="left">left</td>
    <td align="center">center</td>
    <td align="right">right</td>
  </tr>
</table>

<!-- Table 2: merged cells (rowspan / colspan) -->
<table>
  <tr>
    <td colspan="5">&nbsp;</td>
  </tr>
  <tr>
    <td rowspan="3">&nbsp;</td>
    <td>&nbsp;</td>
    <td>&nbsp;</td>
    <td>&nbsp;</td>
    <td>&nbsp;</td>
  </tr>
  <tr>
    <td colspan="3">&nbsp;</td>
    <td>&nbsp;</td>
  </tr>
  <tr>
    <td colspan="3">&nbsp;</td>
    <td>&nbsp;</td>
  </tr>
  <tr>
    <td colspan="5">&nbsp;</td>
  </tr>
</table>

<!-- Table 3: green header bar, image row, blue footer bar -->
<table>
  <tr>
    <td class="green-bar" colspan="3">&nbsp;</td>
  </tr>
  <tr>
    <td>&nbsp;</td>
    <td class="center-img">
      <img src="basketball.jpg" alt="Basketball dunk photo">
    </td>
    <td>&nbsp;</td>
  </tr>
  <tr>
    <td class="blue-bar" colspan="3">&nbsp;</td>
  </tr>
</table>

</body>
</html>
